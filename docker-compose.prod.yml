# =============================================
# SAMARTH AI — Docker Compose (Production)
#
# Override for production environment.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================

services:
  backend:
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=WARNING
      - LOG_FORMAT=json
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  celery-worker:
    command: >
      celery -A app.celery_app:celery_app worker
      --loglevel=warning
      --concurrency=4
      -Q default,scoring,notifications,escalation,evidence
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  celery-beat:
    command: >
      celery -A app.celery_app:celery_app beat
      --loglevel=warning
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:3000"
      - "3000:3000"
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
